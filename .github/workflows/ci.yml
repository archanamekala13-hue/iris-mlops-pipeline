name: Iris MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and evaluate model (fails if test accuracy < 100%)
        run: python train.py

      - name: Run API tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t iris-mlops:ci .
